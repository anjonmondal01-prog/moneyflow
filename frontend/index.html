<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MoneyFlow</title><script>(function(){const nativeFetch=window.fetch.bind(window);let csrfToken='';async function refreshToken(url){try{const tokenUrl=new URL('/api/csrf/',url);const r=await nativeFetch(tokenUrl.toString(),{credentials:'include',cache:'no-store'});const data=await r.clone().json();if(data&&data.csrfToken){csrfToken=data.csrfToken;return true}}catch(e){}return false}window.fetch=async function(input,init){init=init?{...init}:{};const url=typeof input==='string'?input:(input&&input.url)||'';const method=(init.method||((input&&input.method)||'GET')).toUpperCase();if(url.includes('/api/csrf/')){const response=await nativeFetch(input,init);try{const data=await response.clone().json();if(data&&data.csrfToken)csrfToken=data.csrfToken}catch(e){}return response}if(method!=='GET'&&url.includes('/api/')){if(!csrfToken)await refreshToken(url);const headers=new Headers(init.headers||((input&&input.headers)||{}));if(csrfToken)headers.set('X-CSRFToken',csrfToken);init.headers=headers;init.credentials='include'}return nativeFetch(input,init)}})();</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
