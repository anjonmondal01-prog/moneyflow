<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MoneyFlow</title><script>(function(){const nativeFetch=window.fetch.bind(window);let csrfToken='';window.fetch=async function(input,init){init=init?{...init}:{};const url=typeof input==='string'?input:(input&&input.url)||'';const method=(init.method||((input&&input.method)||'GET')).toUpperCase();if(method!=='GET'&&csrfToken){const headers=new Headers(init.headers||((input&&input.headers)||{}));headers.set('X-CSRFToken',csrfToken);init.headers=headers;init.credentials='include'}const response=await nativeFetch(input,init);if(url.includes('/api/csrf/')){try{const data=await response.clone().json();if(data&&data.csrfToken)csrfToken=data.csrfToken}catch(e){}}return response}})();</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
